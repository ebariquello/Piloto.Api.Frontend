<div class="float-right"> 
    <small>
        Your cart: 
        <span *ngIf="userCart.itemCount>0">
            {{userCart.itemCount}} item(s)
            {{userCart.cartPrice | currency: 'BRL' : "symbol" : "2.2-2" }} 
        </span>

        <span *ngIf="userCart.itemCount==0">
            (empty)
        </span>
    </small>
    <button class="btn btn-sm bg-dark text-white"
    [disabled]="userCart.itemCount==0" >
        <i class="fa fa-shopping-cart"></i>
    </button>
</div>
