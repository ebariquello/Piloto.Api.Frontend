<div class="container-fluid">
    <div class="row">
        <div class="col bg-danger text-white">
            <a class="navbar-brand">Online Store</a>
            <!--My Cart Summary-->
            <app-cart-summary></app-cart-summary>
        </div>
    </div>
    <!--Menu-->
    <div class="row text-white">
        <div class="col-3 bg-info p-2">
             <!--Home-->
            <button class="btn btn-lock btn-outline-dark w-100 m-1 " [class.active]="selectedCategory === null "
                (click)="changeCategory(null)">
                HOME
            </button>
            <!-- Categories
            <button *ngFor="let cat of categories" class="btn btn-lock btn-outline-dark w-100 m-1 "
                [class.active]="cat == selectedCategory" (click)="changeCategory(cat)">
                {{ cat }}
            </button> -->
            <!--Admin-->
            <button class="btn btn-lock btn-danger w-100 m-1" routerLink="/admin/main" >Admin</button>
        </div>
        <!--Show Products based on Categories-->
        <div class="col-9  bg-success p-2">

            <div *ngFor="let product of products" class="card m-1 p-1 bg-dark">
                <h4>
                    {{product.name}}
                    <span class="badge badge-pill badge-danger float-right">
                        {{product.price | currency: 'BRL' : 'symbol':'2.2-2'}}
                    </span>
                </h4>
                <div class="card-text bg-dark p-1">
                    {{ product.description}}

                    <button type="button" class="btn btn-info btn-sm float-right" (click)="addProductToCart(product)">
                        Add to Cart
                    </button>

                </div>

            </div>
            <div class="form-inline float-left mr-1">
                <select class="form-control" [value]="productsPerPage" (change)="changePageSize($event.target.value)">
                    <option value="4">Four Products per Page</option>
                    <option value="6">Six Products per Page</option>
                    <option value="8">Eight Products per Page</option>
                </select>
            </div>
            <div class="btn-group float-right">
                <button *ngFor="let pageNum of pageNumbers" class="btn btn-outline-dark" (click)="changePage(pageNum)"
                    [class.active]="pageNum==selectedPage">{{pageNum}}</button>
            </div>
        </div>
    </div>
</div>
