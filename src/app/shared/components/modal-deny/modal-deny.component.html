<div class="modal-deny">
  <h3>Recusar solicitação</h3>
  <p>Tem certeza de que deseja recusar essa solicitação?</p>
  <div class="modal-deny__buttons">
    <button
      class="btn btn-hyperlink"
      (click)="closeModal()">
      Não, cancelar
    </button>
    <button
      class="btn btn-warning pull-right"
      (click)="completeTask(CompleteTaskEnum.REPROVAR)">
      Sim, recusar
    </button>
  </div>
</div>
